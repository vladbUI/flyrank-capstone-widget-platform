<html lang="en">
<head>

  <style>
    body { font-family: Georgia, serif; max-width: 640px; margin: 40px auto; padding: 0 16px; background: #faf6f0; }
    /* Hostile host CSS on purpose: the widget's Shadow DOM must not be affected */
    input, button, label { font-family: "Comic Sans MS", cursive !important; color: red; }
  </style>
</head>
<body>
  <h1>Acme Coffee</h1>
  <p>This page is served from <code>http://localhost:5500</code>, a different origin from the API on <code>:3000</code>.
     The two widgets below come from one script tag each.</p>

  <h2>Get our newsletter</h2>
  <!-- Inline signup widget (seeded, tenant A) -->
  <script async src="http://localhost:3000/widget.js?id=11111111-1111-4111-8111-111111111111"></script>

  <!-- Floating contact widget (seeded, tenant A) -->
  <script async src="http://localhost:3000/widget.js?id=22222222-2222-4222-8222-222222222222"></script>
</body>
</html>
